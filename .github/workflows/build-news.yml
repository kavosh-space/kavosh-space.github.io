name: Build news pages

on:
  push:
    branches: [main]
    paths:
      - "news.json"
      - "build_news.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate news pages + sitemap
        run: python3 build_news.py

      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: rebuild news pages + sitemap [auto]"
          file_pattern: "news/*.html sitemap.xml"
